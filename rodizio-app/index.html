<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#c94a7e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Rodízio de Organistas</title>
<style>
:root{--bg:#fff;--card:#fff;--tx:#1f1220;--mu:#5b4256;--ac:#a22e5f;--ac2:#fbe4ec;--bd:#e3c6d3;--er:#b3261e;--wr:#fff0f4;--li:#6a49a8;--li2:#efe8fb;--zb:#fdf3f7;--on:#fff;--h1:#c94a7e;--h2:#9a76d0;--sh:0 1px 6px rgba(176,57,106,.10)}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
header{position:relative;overflow:hidden;background:linear-gradient(115deg,var(--h1),var(--h2));color:#fff;padding:16px 18px 18px;border-radius:0 0 24px 24px}
header>*{position:relative}
h1{font:italic 600 23px/1.15 "Palatino Linotype","Book Antiqua",Georgia,serif;margin:0}
header small{opacity:.9;font-size:13px}
.hf{position:absolute;right:-4px;top:0;height:100%;width:auto;opacity:.5;pointer-events:none;z-index:0}
header>h1,header>small{z-index:1}
.lg{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:38% 28%;border:2px solid #fff;background:#fde3ec;vertical-align:middle;margin:-4px 10px 0 0;box-shadow:0 1px 4px rgba(0,0,0,.2)}
@media (max-width:520px){.hf{opacity:.3}}
main{max-width:1040px;margin:0 auto;padding:14px 12px}
#p-dados,#p-extras{max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:var(--sh)}
h2{font:italic 600 18px "Palatino Linotype","Book Antiqua",Georgia,serif;margin:0 0 8px;color:var(--ac)}
h2::before{content:"✿ ";font-style:normal;font-size:15px;color:var(--li)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.op{font-size:12px;opacity:.85;margin-left:4px}
input,textarea,select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx)}
input:focus,textarea:focus,select:focus,.chip:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
textarea{min-height:110px}textarea.peq{min-height:86px}
.sep{height:1px;background:var(--bd);margin:14px 0 4px}
.ck{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--tx);margin-top:14px}
.ck input{width:19px;height:19px;padding:0;accent-color:var(--ac)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:8px 14px;border:1px solid var(--bd);border-radius:20px;background:var(--bg);cursor:pointer;user-select:none}
.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
.msg{padding:10px 12px;border-radius:12px;margin-bottom:10px;background:var(--wr);font-size:14px;border:1px solid var(--bd)}
.msg.er{color:var(--er)}
button{font:inherit;padding:10px 16px;border-radius:22px;border:1px solid var(--ac);background:var(--ac);color:var(--on);cursor:pointer}
button.sec{background:transparent;color:var(--ac)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.meses{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;align-items:start}
.meses.larga{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.mes{padding:0;overflow:hidden;margin:0}
.mes h3{margin:0;padding:10px 12px;background:linear-gradient(115deg,var(--h1),var(--h2));color:#fff;font:italic 600 17px "Palatino Linotype","Book Antiqua",Georgia,serif;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mes h3 small{font-size:13px;font-weight:400;opacity:.85}
.mes .n{font:600 11px system-ui,sans-serif;font-style:normal;background:rgba(255,255,255,.24);color:#fff;border-radius:10px;padding:2px 9px;white-space:nowrap}
.pl{width:100%;border-collapse:collapse;font-size:14px}
.pl th{background:var(--ac2);color:var(--ac);font-size:12px;font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd)}
.pl td{padding:5px 8px;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);vertical-align:middle}
.pl th:last-child,.pl td:last-child{border-right:0}
.pl tbody tr:nth-child(even) td{background:var(--zb)}
.pl tbody tr:last-child td{border-bottom:0}
.pl th:first-child,.pl td:first-child{width:36px;text-align:center;font-variant-numeric:tabular-nums;color:var(--mu)}
.pl th.s,.pl td.s{width:46px;color:var(--mu)}
.pl th.nw{white-space:nowrap}
.pl tr.dom td.s{color:var(--li);font-weight:600}
.pl td.cu{font-weight:600}
.pl tr.e td{background:var(--li2)!important;color:var(--li);font-style:italic;font-weight:600}
.vz{color:var(--mu);opacity:.55}
.mes .bat{font-size:13px;padding:7px 12px;color:var(--mu);border-top:1px solid var(--bd)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;border-radius:0;background:transparent;color:var(--mu);padding:9px 4px 10px;font-size:13px;line-height:1.25}
nav button i{display:block;font-style:normal;font-size:18px}
nav button.on{color:var(--ac);font-weight:600;box-shadow:inset 0 3px 0 var(--ac)}
.pt{font-size:14px;margin:3px 0}
.tb{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.tb th{background:var(--ac2);color:var(--ac);font-size:12px;font-weight:600;text-align:left;padding:6px 8px}
.tb td{padding:5px 8px;border-top:1px solid var(--bd)}
.tb td:last-child{text-align:right;color:var(--mu)}
.tb.rs th,.tb.rs td{text-align:center}.tb.rs th:first-child,.tb.rs td:first-child{text-align:left}
.tb.rs td:last-child{color:inherit}
.sub{font-size:13px;color:var(--mu);text-align:center;margin-top:2px}
.tit{font:italic 600 18px "Palatino Linotype","Book Antiqua",Georgia,serif;color:var(--ac)}
.ban{display:block;width:100%;max-width:560px;margin:0 auto 6px}
.canto{display:none}
/* o .pg só existe para repetir o espaço do topo/rodapé ao imprimir; na tela é “transparente” */
.pg,.pg>thead,.pg>tbody,.pg>tfoot,.pg>thead>tr,.pg>tbody>tr,.pg>tfoot>tr,.pg>thead>tr>td,.pg>tbody>tr>td,.pg>tfoot>tr>td{display:block}
.sp{display:none}
@page{size:A4;margin:0}
@media print{
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 :root{--bg:#fff;--card:#fff;--tx:#000;--mu:#555;--ac:#b0396a;--ac2:#fbe4ec;--bd:#f3d3de;--li:#7c5cb8;--li2:#efe8fb;--zb:#fffafc;--sh:none}
 header,nav,.bar,.noprint,.msg{display:none!important}
 body{background:#fff;color:#000;padding:0!important}
 main{max-width:none;padding:0}
 .card{break-inside:avoid;border-color:#e8a7bf}
 .meses{grid-template-columns:repeat(3,1fr);gap:8px}.meses.larga{grid-template-columns:repeat(2,1fr)}
 .mes h3{background:var(--ac2);color:var(--ac);font-size:13px;padding:6px 8px}
 .mes .n{background:#fff;color:var(--ac)}
 .pl{font-size:11.5px}.pl td,.pl th{padding:2px 4px}
 .pl th:first-child,.pl td:first-child{width:24px}.pl th.s,.pl td.s{width:32px}
 .pl td.cu{white-space:nowrap}
 .canto{display:block;position:fixed;width:34mm;z-index:-1}.c1{top:0;left:0}.c2{bottom:0;right:0;transform:rotate(180deg)}
 .pg{display:table!important;width:calc(100% - 20mm);margin:0 10mm}
 .pg>thead{display:table-header-group!important}.pg>tbody{display:table-row-group!important}.pg>tfoot{display:table-footer-group!important}
 .pg>thead>tr,.pg>tbody>tr,.pg>tfoot>tr{display:table-row!important}
 .pg>thead>tr>td,.pg>tbody>tr>td,.pg>tfoot>tr>td{display:table-cell!important}
 .sp{display:block!important;height:22mm}
 .ban{max-width:420px}
}
</style>
</head>
<body>
<div class="canto c1"></div><div class="canto c2"></div>
<header><h1><img id="lg" class="lg" alt="" aria-hidden="true">Rodízio de Organistas</h1><small>Gerador automático · funciona offline</small></header>
<main>
<section id="p-dados" class="p-in">
 <div class="card"><h2>Localidade e período</h2>
  <label for="local">Localidade</label><input id="local" placeholder="Ex.: Central">
  <div class="g2"><div><label for="ano">Ano</label><input id="ano" type="number" inputmode="numeric"></div>
  <div><label for="mes">Mês de início</label><select id="mes"></select></div></div>
  <label for="seq">Sequência anterior (nº do “próximo ano” do rodízio anterior; vazio = 1)</label><input id="seq" type="number" inputmode="numeric" min="1">
 </div>
 <div class="card"><h2>Organistas</h2>
  <label for="nomes">Culto oficial <span class="op">um nome por linha, sem pular linhas (máx. 21)</span></label><textarea id="nomes"></textarea>
  <div class="pt" id="qtd"></div>
  <div class="sep"></div>
  <label for="nomesMeia">Somente meia-hora <span class="op">opcional · um nome por linha</span></label>
  <textarea id="nomesMeia" class="peq" placeholder="Se ficar vazio, a meia-hora usa as organistas do culto oficial"></textarea>
  <label for="nomesRJM">Reunião de jovens e menores <span class="op">opcional · um nome por linha</span></label>
  <textarea id="nomesRJM" class="peq" placeholder="Se ficar vazio, usa as organistas do culto oficial"></textarea>
 </div>
 <div class="card"><h2>Dias de culto (máx. 4 por semana)</h2><div class="chips" id="dias"></div>
  <label class="ck"><input type="checkbox" id="meia"> Mostrar organista da meia-hora (antes do culto)</label>
  <label class="ck"><input type="checkbox" id="rjm"> Incluir reunião de jovens e menores</label>
  <div id="rjmbox" hidden><label>Dia(s) da reunião de jovens e menores</label><div class="chips" id="djm"></div></div>
 </div>
 <div class="card"><h2>Backup no celular</h2><div class="pt" style="color:var(--mu)">Salva todos os anos num arquivo no próprio aparelho. Use para não perder os dados ou trocar de celular.</div>
  <div class="bar" style="margin:10px 0 0"><button id="bk-save">Salvar backup</button><button class="sec" id="bk-load">Restaurar backup</button><input type="file" id="bk-file" accept=".json,application/json" hidden></div></div>
</section>
<section id="p-extras" class="p-in" hidden></section>
<section id="p-rod" class="p-in" hidden></section>
<section id="p-rel" class="p-in" hidden></section>
</main>
<nav><button data-t="dados" class="on"><i>📝</i>Dados</button><button data-t="extras"><i>🌷</i>Extras</button><button data-t="rod"><i>🎹</i>Rodízio</button><button data-t="rel"><i>📄</i>Relatório</button></nav>
<script>
/*ENGINE*/
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DIAS=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const pc=s=>s.toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());
function ciclo(nomes,k){const n=nomes.length,K=nomes.slice();
 if(k>=2&&k<=4&&n%k===0)for(let r=1;r<k;r++)for(let g=0;g<n;g+=k)for(let i=0;i<k;i++)K.push(nomes[g+(i+r)%k]);
 return K}
function deslocamento(n,k,L){if(n===2)return k===2?2:1;const q=n/(k||1);if(Number.isInteger(q))return L/n;return L%2===0?L/2+1:k-1}
function gerar(c){
 const nomes=c.nomes.map(pc),n=nomes.length,k=c.dias.filter(Boolean).length;
 const K=ciclo(nomes,k),L=K.length,sh=deslocamento(n,k,L);
 const ini=Math.min(Math.max(+c.mes||1,1),12)-1;
 /* meia-hora: lista própria (se houver); senão repete o ciclo do culto oficial */
 const lm=(c.nomesMeia||[]).map(pc);
 /* jovens e menores: lista própria (se houver); senão repete as organistas do culto oficial */
 const pj=(c.nomesRJM||[]).length?c.nomesRJM.map(pc):nomes;
 const rj=c.rjm&&c.rjmDias&&c.rjmDias.some(Boolean)?c.rjmDias:null;
 let seq=+c.seq>=1&&+c.seq<=L?+c.seq:1,pos=0;
 let mc=lm.length?(+c.seqMeia||0)%lm.length:0,jc=pj.length?(+c.seqRJM||0)%pj.length:0;
 const meses=MESES.map(nome=>({nome,linhas:[],inicio:null}));
 if(!n||!k)return{meses,proximo:null,L,K,k,n,proxMeia:0,proxRJM:0};
 for(const d=new Date(c.ano,ini,1);d.getFullYear()===c.ano;d.setDate(d.getDate()+1)){
  const m=d.getMonth(),dia=d.getDate(),w=(d.getDay()+6)%7,M=meses[m],sem=DIAS[w];
  if(c.ensaios[m]>0&&dia===+c.ensaios[m])M.linhas.push({dia,sem,ens:true});
  const ct=c.dias[w],rd=rj&&rj[w];
  if(!ct&&!rd)continue;
  const ln={dia,sem};
  if(ct){
   pos=pos===L?1:pos===0?seq:pos+1;
   const j=sh+pos>L?sh+pos-L:sh+pos;
   if(M.inicio===null)M.inicio=pos;
   ln.culto=K[pos-1];ln.meia=lm.length?lm[mc++%lm.length]:K[j-1];
  }
  if(rd){let p=pj[jc++%pj.length];if(p===ln.culto&&pj.length>1)p=pj[jc++%pj.length];ln.rjm=p}
  M.linhas.push(ln);
 }
 meses.forEach(M=>{if(M.inicio===null&&M.linhas.length)M.inicio=pos||seq});
 return{meses,proximo:pos?(pos===L?1:pos+1):null,L,K,k,n,proxMeia:lm.length?mc%lm.length:0,proxRJM:jc%pj.length}}
/*END*/
const anoPadrao=()=>{const t=new Date(),f=new Date(t.getTime()+46*864e5);return f.getFullYear()===t.getFullYear()?t.getFullYear():t.getFullYear()+1};
const PAD=()=>({local:'',ano:anoPadrao(),mes:1,seq:'',nomes:['Organista A','Organista B','Organista C'],nomesMeia:[],nomesRJM:[],dias:[0,0,0,1,0,1,1].map(Boolean),meia:false,rjm:false,rjmDias:[0,0,0,0,0,0,1].map(Boolean),seqMeia:0,seqRJM:0,ensaios:Array(12).fill(''),bat:Array(12).fill(''),ceias:'',fones:{},outros:''});
let S=PAD(),DB=null,tm=0,sujo=false,R,relAno=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dd=n=>String(n).padStart(2,'0');
const vz=x=>x?esc(x):'<span class="vz">–</span>';
const todos=d=>{const v=new Set(),o=[];[...d.nomes,...(d.nomesMeia||[]),...(d.nomesRJM||[])].forEach(n=>{const k=n.toLowerCase();if(!v.has(k)){v.add(k);o.push(n)}});return o};
/* ---- Banco de dados (IndexedDB): um registro por ano ---- */
const abrir=()=>new Promise((ok,er)=>{const q=indexedDB.open('rodizio-db',1);q.onupgradeneeded=()=>{q.result.createObjectStore('anos',{keyPath:'ano'});q.result.createObjectStore('cfg')};q.onsuccess=()=>ok(q.result);q.onerror=()=>er(q.error)});
const tx=(st,m,fn)=>DB?new Promise((ok,er)=>{const t=DB.transaction(st,m),r=fn(t.objectStore(st));t.oncomplete=()=>ok(r.result);t.onerror=()=>er(t.error)}):Promise.resolve(null);
const calc=d=>{const k=d.dias.filter(Boolean).length;return k>=1&&k<=4&&d.nomes.length?gerar(d):null};
async function grava(){clearTimeout(tm);if(!sujo)return;sujo=false;const g=calc(S);
 try{await tx('anos','readwrite',s=>s.put({ano:S.ano,dados:JSON.parse(JSON.stringify(S)),rodizio:g&&{meses:g.meses,proximo:g.proximo,L:g.L,proxMeia:g.proxMeia,proxRJM:g.proxRJM},atualizado:Date.now()}));await tx('cfg','readwrite',s=>s.put(S.ano,'ultimo'))}catch(e){}}
const save=()=>{sujo=true;clearTimeout(tm);tm=setTimeout(grava,300)};
async function init(){
 try{DB=await abrir()}catch(e){DB=null}
 const ult=await tx('cfg','readonly',s=>s.get('ultimo')),rec=ult&&await tx('anos','readonly',s=>s.get(ult));
 if(rec)S=Object.assign(PAD(),rec.dados);
 else try{const o=JSON.parse(localStorage.getItem('rodizio')||'null');if(o){S=Object.assign(PAD(),o);save()}}catch(e){}
 preencher();
 if(!DB)$('main').insertAdjacentHTML('afterbegin','<div class="msg">Banco de dados indisponível neste navegador: os dados não serão guardados.</div>')}
addEventListener('pagehide',grava);document.addEventListener('visibilitychange',()=>{if(document.hidden)grava()});
/* ---- Dados ---- */
$('#mes').innerHTML=MESES.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('');
const qtd=()=>{let t=`${S.nomes.length} organista(s) · ${S.dias.filter(Boolean).length} culto(s) por semana`;
 if(S.nomesMeia.length)t+=` · ${S.nomesMeia.length} só meia-hora`;if(S.nomesRJM.length)t+=` · ${S.nomesRJM.length} jovens e menores`;$('#qtd').textContent=t};
const chipsHtml=(arr,sel)=>DIAS.map((d,i)=>`<span class="chip${arr[i]?' on':''}" data-i="${i}">${d}</span>`).join('');
function chips(){$('#dias').innerHTML=chipsHtml(S.dias);$('#djm').innerHTML=chipsHtml(S.rjmDias);$('#rjmbox').hidden=!S.rjm;qtd()}
function preencher(){$('#local').value=S.local;$('#ano').value=S.ano;$('#mes').value=S.mes;$('#seq').value=S.seq;
 $('#nomes').value=S.nomes.join('\n');$('#nomesMeia').value=S.nomesMeia.join('\n');$('#nomesRJM').value=S.nomesRJM.join('\n');
 $('#meia').checked=S.meia;$('#rjm').checked=S.rjm;chips()}
$('#dias').onclick=e=>{const i=e.target.dataset.i;if(i==null)return;S.dias[i]=!S.dias[i];save();chips()};
$('#djm').onclick=e=>{const i=e.target.dataset.i;if(i==null)return;S.rjmDias[i]=!S.rjmDias[i];save();chips()};
$('#local').oninput=e=>{S.local=e.target.value;save()};
$('#ano').onchange=async e=>{const v=+e.target.value;if(!(v>=2000&&v<=2100)){e.target.value=S.ano;return}if(v===S.ano)return;
 await grava();const rec=await tx('anos','readonly',s=>s.get(v));
 S=rec?Object.assign(PAD(),rec.dados):Object.assign(PAD(),S,{ano:v,seq:'',seqMeia:0,seqRJM:0,mes:1,bat:Array(12).fill(''),ceias:''});preencher();save()};
$('#mes').onchange=e=>{S.mes=+e.target.value;save()};
$('#seq').oninput=e=>{S.seq=e.target.value;save()};
$('#meia').onchange=e=>{S.meia=e.target.checked;save()};
$('#rjm').onchange=e=>{S.rjm=e.target.checked;$('#rjmbox').hidden=!S.rjm;save()};
const lista=v=>v.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,21);
$('#nomes').oninput=e=>{S.nomes=lista(e.target.value);save();qtd()};
$('#nomesMeia').oninput=e=>{const v=lista(e.target.value);
 if(v.length&&!S.nomesMeia.length&&!S.meia){S.meia=true;$('#meia').checked=true}
 S.nomesMeia=v;save();qtd()};
$('#nomesRJM').oninput=e=>{const v=lista(e.target.value);
 if(v.length&&!S.nomesRJM.length&&!S.rjm){S.rjm=true;$('#rjm').checked=true;$('#rjmbox').hidden=false}
 S.nomesRJM=v;save();qtd()};
/* ---- Extras ---- */
function extras(){
 const T=todos(S);
 $('#p-extras').innerHTML=`
 <div class="card"><h2>Ensaios (somente o dia do mês)</h2><div class="g3">${MESES.map((m,i)=>`<div><label>${m}</label><input type="number" inputmode="numeric" min="1" max="31" data-k="ensaios" data-i="${i}" value="${esc(S.ensaios[i])}"></div>`).join('')}</div></div>
 <div class="card"><h2>Batismos de ${S.ano} (organista do mês)</h2><datalist id="dl">${T.map(n=>`<option value="${esc(pc(n))}">`).join('')}</datalist><div class="g3">${MESES.map((m,i)=>`<div><label>${m}</label><input list="dl" data-k="bat" data-i="${i}" value="${esc(S.bat[i])}"></div>`).join('')}</div></div>
 <div class="card"><h2>Santas ceias de ${S.ano}</h2><label>Organistas (uma por linha, ex.: Páscoa – Maria)</label><textarea data-k="ceias">${esc(S.ceias)}</textarea></div>
 <div class="card"><h2>Telefones das organistas</h2>${T.map(n=>`<label>${esc(pc(n))}</label><input type="tel" data-f="${esc(n)}" value="${esc(S.fones[n]||'')}">`).join('')}
 <label>Outros telefones (encarregado, cooperador…)</label><textarea data-k="outros">${esc(S.outros)}</textarea></div>`}
